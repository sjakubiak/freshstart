name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build sideload APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FreshStart.apk

      - name: Build Google Play bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" ./gradlew bundleRelease -Pstore=true --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab FreshStart-play.aab
          rm "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: FreshStart
          path: |
            FreshStart.apk
            FreshStart-play.aab
          if-no-files-found: ignore

      - name: Publish sideload release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FreshStart 1.0.${{ github.run_number }}
          body: Download FreshStart.apk on your Android phone and open it to install or update.
          files: FreshStart.apk
          make_latest: true
